location = /analytics {
    return 308 /analytics/;
}

location = /analytics/ {
    auth_basic "Proofline Analytics";
    auth_basic_user_file /etc/nginx/auth/proofline-analytics.htpasswd;

    root /srv/services/data/proofline-analytics/report;
    try_files /index.html =404;
    default_type text/html;
    charset utf-8;

    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /analytics/views.json {
    auth_basic off;
    alias /srv/services/data/proofline-analytics/report/public-views.json;
    default_type application/json;
    charset utf-8;

    add_header Cache-Control "public, max-age=300" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
}
