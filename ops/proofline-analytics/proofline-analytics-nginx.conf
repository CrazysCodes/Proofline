map $host $proofline_analytics_enabled {
    default 0;
    analytics.example.com 1;
    example.com 1;
}

log_format proofline_analytics escape=json
    '{"time":"$time_iso8601",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"args":"$args",'
    '"status":$status,'
    '"content_type":"$sent_http_content_type",'
    '"referer":"$http_referer",'
    '"ua":"$http_user_agent",'
    '"ip":"$remote_addr",'
    '"prefetch":"$http_next_router_prefetch",'
    '"rsc":"$http_rsc"}';

access_log /var/log/nginx/proofline-analytics.log proofline_analytics
    if=$proofline_analytics_enabled;
